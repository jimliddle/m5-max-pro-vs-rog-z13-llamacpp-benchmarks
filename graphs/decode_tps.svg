<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Decode TPS comparison</title>
  <desc id="desc">Bar chart comparing decode throughput for ASUS Vulkan and Apple M5 Max Metal.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Real-World Generation Throughput</text>
  <text x="48" y="84" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Qwen3.5-35B-A3B-Q5_K_S.gguf, llama.cpp decode-only tg128</text>
  <line x1="140" y1="420" x2="820" y2="420" stroke="#9ca3af" stroke-width="1"/>
  <line x1="140" y1="120" x2="140" y2="420" stroke="#9ca3af" stroke-width="1"/>
  <text x="100" y="424" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#6b7280">0</text>
  <text x="100" y="361.5" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#6b7280">20</text>
  <text x="100" y="299" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#6b7280">40</text>
  <text x="100" y="236.5" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#6b7280">60</text>
  <text x="100" y="174" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#6b7280">80</text>
  <text x="100" y="111.5" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#6b7280">100 tok/s</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="140" y1="357.5" x2="820" y2="357.5"/>
    <line x1="140" y1="295" x2="820" y2="295"/>
    <line x1="140" y1="232.5" x2="820" y2="232.5"/>
    <line x1="140" y1="170" x2="820" y2="170"/>
    <line x1="140" y1="107.5" x2="820" y2="107.5"/>
  </g>
  <rect x="245" y="252.2" width="145" height="167.8" rx="4" fill="#2563eb"/>
  <rect x="510" y="120.1" width="145" height="299.9" rx="4" fill="#16a34a"/>
  <text x="317.5" y="241" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#111827">53.73</text>
  <text x="582.5" y="109" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#111827">95.98</text>
  <text x="317.5" y="458" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#111827">ASUS Vulkan</text>
  <text x="582.5" y="458" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#111827">Mac Metal</text>
  <text x="582.5" y="486" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#16a34a">1.79x faster</text>
</svg>
