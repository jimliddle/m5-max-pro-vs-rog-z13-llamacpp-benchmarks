<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">GPU backend throughput comparison</title>
  <desc id="desc">Grouped bar chart comparing ASUS Vulkan and Apple M5 Max Metal throughput across the benchmark matrix.</desc>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">GPU Backend Throughput</text>
  <text x="48" y="84" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">ASUS AMD 8060S Vulkan vs Apple M5 Max Metal, same Qwen3.5 A3B Q5 model</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#6b7280">
    <text x="110" y="510" text-anchor="end">0</text>
    <text x="110" y="430" text-anchor="end">750</text>
    <text x="110" y="350" text-anchor="end">1500</text>
    <text x="110" y="270" text-anchor="end">2250</text>
    <text x="110" y="190" text-anchor="end">3000 tok/s</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="130" y1="505" x2="1040" y2="505"/>
    <line x1="130" y1="425" x2="1040" y2="425"/>
    <line x1="130" y1="345" x2="1040" y2="345"/>
    <line x1="130" y1="265" x2="1040" y2="265"/>
    <line x1="130" y1="185" x2="1040" y2="185"/>
  </g>
  <line x1="130" y1="505" x2="1040" y2="505" stroke="#9ca3af"/>
  <line x1="130" y1="185" x2="130" y2="505" stroke="#9ca3af"/>
  <rect x="780" y="40" width="18" height="18" fill="#2563eb"/>
  <text x="806" y="55" font-family="Arial, sans-serif" font-size="14" fill="#111827">ASUS Vulkan</text>
  <rect x="910" y="40" width="18" height="18" fill="#16a34a"/>
  <text x="936" y="55" font-family="Arial, sans-serif" font-size="14" fill="#111827">Mac Metal</text>
  <g>
    <rect x="168" y="398.4" width="46" height="106.6" rx="3" fill="#2563eb"/>
    <rect x="218" y="186.1" width="46" height="318.9" rx="3" fill="#16a34a"/>
    <text x="216" y="535" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111827">Prompt 512</text>
  </g>
  <g>
    <rect x="338" y="402.6" width="46" height="102.4" rx="3" fill="#2563eb"/>
    <rect x="388" y="196.3" width="46" height="308.7" rx="3" fill="#16a34a"/>
    <text x="386" y="535" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111827">Prompt 2048</text>
  </g>
  <g>
    <rect x="508" y="499.3" width="46" height="5.7" rx="3" fill="#2563eb"/>
    <rect x="558" y="494.8" width="46" height="10.2" rx="3" fill="#16a34a"/>
    <text x="556" y="535" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111827">Decode 128</text>
  </g>
  <g>
    <rect x="678" y="481.6" width="46" height="23.4" rx="3" fill="#2563eb"/>
    <rect x="728" y="461.1" width="46" height="43.9" rx="3" fill="#16a34a"/>
    <text x="726" y="535" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111827">512 + 128</text>
  </g>
  <g>
    <rect x="848" y="454.4" width="46" height="50.6" rx="3" fill="#2563eb"/>
    <rect x="898" y="405.5" width="46" height="99.5" rx="3" fill="#16a34a"/>
    <text x="896" y="535" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111827">2048 + 128</text>
  </g>
  <text x="548" y="585" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4b5563">Bars use a 0-3000 tok/s scale; decode bars are small because prompt-processing throughput is much higher.</text>
</svg>
